# Blyx Bootstrap Configuration Example
# Copy this file to bootstrap.toml and customize for your build environment
# Documentation: https://blyx-lang.space/docs/contributing/bootstrap
# Created by Rahul Chaube — https://blyx-lang.space

[build]
# Number of parallel build jobs (default: number of CPU cores)
jobs = 0

# Optimization level for the compiler itself
# Options: "debug" (default), "release"
compiler-optimize = "debug"

# Target triple for cross-compilation
# Examples: "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "wasm32-unknown-unknown"
# target = "x86_64-unknown-linux-gnu"

[compiler]
# Enable incremental compilation cache
incremental-cache = true

# Cache directory path (default: .blyx-cache/)
cache-dir = ".blyx-cache"

[toolchain]
# Channel to use: "stable", "beta", "nightly"
channel = "stable"

[paths]
# Where to install Blyx tools (default: ~/.blyx/bin)
# install-dir = "/usr/local/bin"
