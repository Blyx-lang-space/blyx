name: Documentation problem
description: Report an issue with documentation content.
labels: ["A-docs"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for finding a documentation problem! 📚

        Documentation problems might be grammatical issues, typos, or unclear wording, please provide details regarding the documentation including where it is present.

        Note: If your issue is for one of these, please use their dedicated issue tracker instead:
        - [The Blyx Book](https://github.com/Blyx-lang-space/blyx/issues)
        - [Blyx by Example](https://github.com/Blyx-lang-space/blyx/issues)
        - [The Blyx Edition Guide](https://github.com/Blyx-lang-space/blyx/issues)
        - [The Blyx Package Book](https://github.com/Blyx-lang-space/blyx/issues)
        - [The Blyx Linter Guide](https://github.com/Blyx-lang-space/blyx/issues)
        - [The Blyx Reference](https://github.com/Blyx-lang-space/blyx/issues)
        - [The Blyxonomicon](https://github.com/Blyx-lang-space/blyx/issues)
        - [The Embedded Book](https://github.com/rust-embedded/book/issues)

        Or, if you find an issue related to Blyx documentation generation (e.g. doctest, docs UI), please use the documentation issue template instead.

        All other documentation issues should be filed here.

  - type: textarea
    id: location
    attributes:
      label: Location (URL)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
